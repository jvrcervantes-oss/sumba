<script type="text/babel">
const { useState, useEffect, useRef } = React;

function idrK(n) { return "Rp " + n + "k"; }
function usdApprox(kIDR) { return "$" + Math.round((kIDR * 1000) / 16000); }
function daysBetween(a, b) {
  if (!a || !b) return 0;
  const d = (new Date(b) - new Date(a)) / 86400000;
  return d > 0 ? Math.round(d) : 0;
}
function fmtDate(s, lang) {
  if (!s) return "—";
  const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString(lang === "es" ? "es-ES" : "en-GB", { day: "numeric", month: "short" });
}
function todayISO(offset = 0) {
  const d = new Date(); d.setDate(d.getDate() + offset);
  return d.toISOString().slice(0, 10);
}

const Ic = {
  base: (p, path) => (
    <svg width={p.s || 22} height={p.s || 22} viewBox="0 0 24 24" fill="none"
      stroke={p.c || "currentColor"} strokeWidth={p.w || 1.9} strokeLinecap="round" strokeLinejoin="round"
      style={p.style}>{path}</svg>

  arrow:  (p={}) => Ic.base(p, <><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></>),
  arrowL: (p={}) => Ic.base(p, <><path d="M19 12H5"/><path d="M11 18l-6-6 6-6"/></>),
  cal:    (p={}) => Ic.base(p, <><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></>),
  pin:    (p={}) => Ic.base(p, <><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></>),
  check:  (p={}) => Ic.base(p, <path d="M4 12.5l5 5 11-11"/>),
  star:   (p={}) => (
    <svg width={p.s || 18} height={p.s || 18} viewBox="0 0 24 24" fill={p.c || "currentColor"} style={p.style}>
      <path d="M12 2.5l2.9 6 6.6.7-4.9 4.5 1.4 6.5L12 17.8 6 20.2l1.4-6.5L2.5 9.2l6.6-.7z"/></svg>
  ),
  shield: (p={}) => Ic.base(p, <><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></>),
  helmet: (p={}) => Ic.base(p, <><path d="M3.5 13a8.5 8.5 0 0 1 17 0v1.5a2 2 0 0 1-2 2H10l-4.5 2 .8-3.2A8.4 8.4 0 0 1 3.5 13z"/><path d="M9.5 13.5h11"/></>),
  box:    (p={}) => Ic.base(p, <><path d="M3 8l9-4 9 4-9 4-9-4z"/><path d="M3 8v8l9 4 9-4V8"/><path d="M12 12v8"/></>),

  road:   (p={}) => Ic.base(p, <><path d="M5 21L8 3M19 21L16 3M12 5v2M12 11v2M12 17v2"/></>),
  globe:  (p={}) => Ic.base(p, <><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/></>),
  speedo: (p={}) => Ic.base(p, <><path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-4.5"/><circle cx="12" cy="16" r="1.3" fill="currentColor"/></>),
  gear:   (p={}) => Ic.base(p, <><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></>),
  weight: (p={}) => Ic.base(p, <><path d="M7 8h10l2 12H5z"/><circle cx="12" cy="5" r="2.5"/></>),

  drop:   (p={}) => Ic.base(p, <path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>),

  wheel:  (p={}) => Ic.base(p, <><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.2"/><path d="M12 3v6.8M12 15.2V21M3 12h6.8M15.2 12H21M5.6 5.6l4.8 4.8M13.6 13.6l4.8 4.8M18.4 5.6l-4.8 4.8M10.4 13.6l-4.8 4.8"/></>),
  surf:   (p={}) => Ic.base(p, <><path d="M12 2c3.8 2.2 6.5 7 6.5 11.5a6.5 6.5 0 0 1-13 0C5.5 9 8.2 4.2 12 2z"/><line x1="12" y1="7" x2="12" y2="18"/><path d="M9.8 17.5 L14.2 7"/></>),
  shop:   (p={}) => Ic.base(p, <><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>),
  plane:  (p={}) => Ic.base(p, <><path d="M22 2L11 13"/><path d="M22 2L15 22l-4-9-9-4 20-7z"/></>),

function Logo({ dark, s = 1 }) {
  const col = dark ? "var(--sand)" : "var(--ink)";
  return (
    <a href="#top" style={{ display: "flex", alignItems: "center", gap: 11 * s, lineHeight: 1 }}>
      <img src="assets/images/logo.png" alt="Bali Best Motorcycle"
        style={{ width: 40 * s, height: 40 * s, borderRadius: "50%", objectFit: "cover", objectPosition: "center 22%", flexShrink: 0, boxShadow: "0 4px 14px oklch(0.62 0.16 33 / 0.35)" }} />

          by Bali Best Motorcycle
        </span>
      </span>
    </a>
  );
}

function SunBurst({ size = 360, style }) {
  const rays = Array.from({ length: 40 });
  return (
    <svg width={size} height={size} viewBox="0 0 200 200" style={style} aria-hidden="true">
      <g style={{ transformOrigin: "100px 100px", animation: "spin-slow 90s linear infinite" }}>
        {rays.map((_, i) => (
          <rect key={i} x="99.2" y="2" width="1.6" height="42"
            fill="var(--sun)" opacity={i % 2 ? 0.35 : 0.6}
            transform={`rotate(${i * 9} 100 100)`} />
        ))}
      </g>
    </svg>
  );
}

function Waves({ flip, color = "var(--sand)", style }) {
  return (
    <svg viewBox="0 0 1440 90" preserveAspectRatio="none"
      style={{ display: "block", width: "100%", height: 70, transform: flip ? "scaleY(-1)" : "none", ...style }}>
      <path d="M0 50 C 180 90 360 10 540 40 C 720 70 900 20 1080 45 C 1260 70 1380 35 1440 45 L1440 90 L0 90 Z" fill={color}/>
    </svg>
  );
}

const CAT_GRAD = {
  scooter:   ["var(--ocean-bright)", "var(--ocean)"],
  trail:     ["var(--sun)", "var(--sunset)"],
  adventure: ["var(--sunset)", "var(--coral)"],
  sport:     ["var(--ocean)", "var(--ocean-deep)"],
  buggy:     ["var(--coral)", "var(--sunset)"],
};
function BikeArt({ bike, h = 200, showLabel = true, src }) {
  const photoSrc = src || bike.photo;
  if (photoSrc) {
    return (
      <div style={{
        position: "relative", height: h, width: "100%", overflow: "hidden",
        background: "var(--shell)", display: "flex", alignItems: "center", justifyContent: "center",
      }}>
        <img src={photoSrc} alt={bike.model}
          style={{ width: "100%", height: "100%", objectFit: "contain", padding: "8px" }} />
      </div>
    );
  }
  const [c1, c2] = CAT_GRAD[bike.cat] || CAT_GRAD.adventure;
  return (
    <div style={{
      position: "relative", height: h, width: "100%", overflow: "hidden",
      background: `linear-gradient(150deg, color-mix(in oklch, ${c1} 60%, var(--sand)), color-mix(in oklch, ${c2} 55%, var(--sand)))`,
      display: "flex", alignItems: "center", justifyContent: "center",
    }}>
      <div style={{ position: "absolute", inset: 0, opacity: 0.18,
        backgroundImage: "repeating-linear-gradient(125deg, var(--ink) 0 1.5px, transparent 1.5px 14px)" }} />
      <span style={{ position: "absolute", fontFamily: "var(--font-display)", fontWeight: 800,
        fontSize: h * 0.62, color: "var(--shell)", opacity: 0.32, lineHeight: 0.8,
        letterSpacing: "-0.04em", whiteSpace: "nowrap" }}>{bike.cc || "—"}</span>
      {bike.cat === "buggy" ? (
        <svg width={h * 1.1} height={h * 0.42} viewBox="0 0 140 56" style={{ position: "relative", opacity: 0.92 }}>
          <circle cx="28" cy="44" r="11" fill="none" stroke="var(--shell)" strokeWidth="3.2"/>
          <circle cx="112" cy="44" r="11" fill="none" stroke="var(--shell)" strokeWidth="3.2"/>
          <rect x="20" y="18" width="100" height="26" rx="8" fill="none" stroke="var(--shell)" strokeWidth="3.2"/>
          <path d="M40 18 L50 6 H90 L100 18" fill="none" stroke="var(--shell)" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"/>
          <line x1="50" y1="6" x2="50" y2="18" stroke="var(--shell)" strokeWidth="2" strokeDasharray="3 3"/>
          <line x1="90" y1="6" x2="90" y2="18" stroke="var(--shell)" strokeWidth="2" strokeDasharray="3 3"/>
        </svg>
      ) : (
        <svg width={h * 0.9} height={h * 0.42} viewBox="0 0 120 56" style={{ position: "relative", opacity: 0.92 }}>
          <circle cx="24" cy="40" r="13" fill="none" stroke="var(--shell)" strokeWidth="3.2"/>
          <circle cx="96" cy="40" r="13" fill="none" stroke="var(--shell)" strokeWidth="3.2"/>
          <path d="M24 40 L46 22 L78 22 M55 22 L70 40 H96 M46 22 L40 40" fill="none" stroke="var(--shell)" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round"/>
          <path d="M78 22 q8 -4 13 2" fill="none" stroke="var(--shell)" strokeWidth="3.2" strokeLinecap="round"/>
        </svg>
      )}
      {showLabel && (
        <span style={{ position: "absolute", bottom: 10, left: 10,
          fontFamily: "var(--font-mono)", fontSize: 9.5, letterSpacing: "0.1em",
          textTransform: "uppercase", color: "var(--ink)",
          background: "color-mix(in oklch, var(--sand) 78%, transparent)",
          padding: "4px 8px", borderRadius: 6, backdropFilter: "blur(3px)" }}>
          photo · {bike.model}
        </span>
      )}
    </div>
  );
}

function Stars({ n = 5, s = 14 }) {
  return <span style={{ display: "inline-flex", gap: 1.5, color: "var(--sunset)" }}>
    {Array.from({ length: n }).map((_, i) => <Ic.star key={i} s={s} />)}
  </span>;
}

Object.assign(window, { idrK, usdApprox, daysBetween, fmtDate, todayISO, Ic, Logo, SunBurst, Waves, BikeArt, Stars });
</script>

<script type="text/babel">
function LangSwitch({ lang, setLang, dark }) {
  return (
    <div style={{
      display: "inline-flex", padding: 3, borderRadius: 999,
      background: dark ? "color-mix(in oklch, white 12%, transparent)" : "color-mix(in oklch, var(--ink) 8%, transparent)",
      fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 700, letterSpacing: "0.04em",
    }}>
      {["en", "es"].map((l) => (
        <button key={l} onClick={() => setLang(l)}
          style={{
            padding: "5px 11px", borderRadius: 999, textTransform: "uppercase",
            color: lang === l ? (dark ? "var(--ink)" : "var(--sand)") : (dark ? "var(--sand)" : "var(--ink-soft)"),
            background: lang === l ? (dark ? "var(--sand)" : "var(--ink)") : "transparent",
            transition: "all .2s",
          }}>{l}</button>
      ))}
    </div>
  );
}

function NavBar({ t, lang, setLang, onBook, dark, onHome }) {
  const [scrolled, setScrolled]     = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);
  useEffect(() => {
    const f = () => setScrolled(window.scrollY > 30);
    window.addEventListener("scroll", f); return () => window.removeEventListener("scroll", f);
  }, []);
  useEffect(() => {
    document.body.classList.toggle("no-scroll", mobileOpen);
    return () => document.body.classList.remove("no-scroll");
  }, [mobileOpen]);
  const links = [
    { k: "navFleet", href: "#fleet" }, { k: "navHow", href: "#how" },
    { k: "navRoutes", href: "#routes" }, { k: "navHelp", href: "https://wa.me/62881037978255", target: "_blank", rel: "noopener" },
  ];
  const onDarkHero = dark && !scrolled && !mobileOpen;
  const close = () => setMobileOpen(false);
  return (
    <>
      <header style={{
        position: "fixed", top: 0, left: 0, right: 0, zIndex: 50,
        transition: "background .35s cubic-bezier(.2,.7,.3,1), box-shadow .35s",

      }}>
        <div className="wrap" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", height: 76 }}>
          <div onClick={() => { close(); onHome(); }} style={{ cursor: "pointer" }}><Logo dark={onDarkHero} /></div>
          <nav style={{ display: "flex", alignItems: "center", gap: 30 }} className="nav-links">
            {links.map((l) => (
              <a key={l.k} href={l.href} target={l.target} rel={l.rel} style={{
                fontWeight: 600, fontSize: 15, color: onDarkHero ? "var(--sand)" : "var(--ink-soft)",
                transition: "color .2s", position: "relative",
              }} className="nav-link">{t[l.k]}</a>
            ))}
          </nav>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <span className="nav-lang"><LangSwitch lang={lang} setLang={setLang} dark={onDarkHero} /></span>
            <button className="btn btn-primary" style={{ padding: "11px 20px", fontSize: 15 }} onClick={onBook}>
              {t.book} <Ic.arrow s={17} c="white" />
            </button>
            <button className="mob-menu-btn" onClick={() => setMobileOpen(!mobileOpen)}
              aria-label="Toggle menu" aria-expanded={String(mobileOpen)}
              style={{ width: 40, height: 40, borderRadius: 10, cursor: "pointer",
                background: mobileOpen ? "var(--sand-2)" : "transparent",
                border: "1.5px solid color-mix(in oklch, var(--ink) 22%, transparent)",
                color: onDarkHero ? "white" : "var(--ink)",
                transition: "background .2s, border-color .2s", placeItems: "center" }}>
              {mobileOpen
                ? <svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
                : <svg width="16" height="14" viewBox="0 0 24 20" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M0 2h24M0 10h18M0 18h24"/></svg>
              }
            </button>
          </div>
        </div>
      </header>

      {/* Overlay */}
      <div onClick={close} style={{
        position: "fixed", inset: 0, zIndex: 48,
        background: "oklch(0.22 0.045 202 / 0.52)",
        backdropFilter: "blur(3px)",
        opacity: mobileOpen ? 1 : 0,
        pointerEvents: mobileOpen ? "all" : "none",
        transition: "opacity .3s",
      }} />

      {/* Drawer */}
      <div style={{
        position: "fixed", top: 76, right: 0, bottom: 0, zIndex: 49,
        width: "min(300px, 100vw)",
        background: "var(--sand)",
        boxShadow: "-4px 0 32px oklch(0.4 0.04 210 / 0.14)",
        display: "flex", flexDirection: "column",
        padding: "24px 24px 36px",
        transform: mobileOpen ? "translateX(0)" : "translateX(105%)",
        transition: "transform .32s cubic-bezier(.2,.8,.3,1)",
        overflowY: "auto",
      }}>
        <nav style={{ display: "flex", flexDirection: "column" }}>
          {links.map((l, i) => (
            <a key={l.k} href={l.href} target={l.target} rel={l.rel} onClick={close}
              style={{
                fontFamily: "var(--font-display)", fontWeight: 700,
                fontSize: 24, color: "var(--ink)", letterSpacing: "-0.02em",
                padding: "15px 0",
                borderBottom: i < links.length - 1 ? "1px solid var(--sand-3)" : "none",
                display: "block",
              }}>
              {t[l.k]}
            </a>
          ))}
        </nav>
        <a href="https://wa.me/62881037978255" target="_blank" rel="noopener"
          className="btn btn-ghost btn-block"
          style={{ fontSize: 15, textDecoration: "none", display: "flex", marginTop: 28 }}>
          <Ic.phone s={16} /> WhatsApp
        </a>
        <div style={{ marginTop: 28, paddingTop: 24, borderTop: "1px solid var(--sand-3)", display: "flex", justifyContent: "center" }}>
          <div style={{ display: "inline-flex", padding: 3, borderRadius: 999, background: "color-mix(in oklch, var(--ink) 8%, transparent)", fontFamily: "var(--font-mono)", fontSize: 11, fontWeight: 700, letterSpacing: "0.04em" }}>
            {["en", "es"].map((l) => (
              <button key={l}
                onClick={() => { setLang(l); }}
                style={{
                  padding: "5px 14px", borderRadius: 999, textTransform: "uppercase", border: "none", cursor: "pointer",
                  color: lang === l ? "var(--sand)" : "var(--ink-soft)",
                  background: lang === l ? "var(--ink)" : "transparent",
                  fontFamily: "inherit", fontSize: "inherit", fontWeight: "inherit", letterSpacing: "inherit",
                  transition: "all .2s",
                }}>{l}</button>
            ))}
          </div>
        </div>
      </div>
    </>
  );
}

  return (

      <Waves color="var(--night-2)" style={{ height: 60, marginTop: -1 }} />
      <div className="wrap" style={{ padding: "30px 28px 50px", position: "relative", zIndex: 1 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 40, justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ maxWidth: 320 }}>
            <Logo dark s={1.1} />
            <p style={{ marginTop: 16, color: "color-mix(in oklch, var(--sand) 72%, transparent)", fontSize: 14.5, lineHeight: 1.6 }}>

              Denpasar, Bali, Indonesia
            </p>
            <a href="https://wa.me/62881037978255" target="_blank" rel="noopener"
              style={{ display: "inline-flex", alignItems: "center", gap: 8, marginTop: 14, fontSize: 14.5, fontWeight: 700, color: "var(--ocean-bright)", textDecoration: "none" }}>

function FeaturesSection({ t, lang }) {
  const features = BBM.FEATURES;
  const total = features.length;
  const [current, setCurrent] = useState(0);
  const [dir, setDir]         = useState(1);
  const [phase, setPhase]     = useState('idle');
  const timer  = useRef(null);
  const touchX = useRef(0);

  const go = (idx) => {
    if (phase !== 'idle' || idx === current) return;
    if (timer.current) clearTimeout(timer.current);
    setDir(idx > current ? 1 : -1);
    setPhase('out');
    timer.current = setTimeout(() => {
      setCurrent(idx);
      setPhase('in');
      timer.current = setTimeout(() => setPhase('idle'), 380);
    }, 255);
  };

  useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);

  useEffect(() => {
    const h = (e) => {
      if (phase !== 'idle') return;
      if (e.key === 'ArrowRight') go(current < total - 1 ? current + 1 : 0);
      if (e.key === 'ArrowLeft')  go(current > 0 ? current - 1 : total - 1);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [current, phase]);

  const f    = features[current];
  const Icon = Ic[f.icon] || Ic.bolt;
  const D    = (phase === 'out' ? (dir > 0 ? 1 : -1) : (dir > 0 ? 1 : -1)) * 38;
  const cls  = phase === 'out' ? 'feat-out' : phase === 'in' ? 'feat-in' : '';

  return (
    <section
      style={{ background:"var(--night)", minHeight:"100dvh", display:"flex", flexDirection:"column", position:"relative", overflow:"hidden" }}
      onTouchStart={(e) => { touchX.current = e.touches[0].clientX; }}
      onTouchEnd={(e) => {
        const dx = e.changedTouches[0].clientX - touchX.current;
        if (dx < -50) go(current < total-1 ? current+1 : 0);
        else if (dx > 50) go(current > 0 ? current-1 : total-1);
      }}
    >
      <style>{`
        @keyframes featOut { to   { opacity:0; transform:translateX(var(--fd-o)); } }
        @keyframes featIn  { from { opacity:0; transform:translateX(var(--fd-i)); } }
        .feat-out { animation: featOut 240ms cubic-bezier(0.55,0,1,0.45) forwards; }
        .feat-in  { animation: featIn  370ms cubic-bezier(0.23,1,0.32,1)  forwards; }
        @media (prefers-reduced-motion:reduce) { .feat-out,.feat-in { animation:none; opacity:1; transform:none; } }
        @media (max-width:860px) { .feat-split { grid-template-columns:1fr !important; } .feat-vis { display:none !important; } }
        .feat-dot { border:none;padding:0;cursor:pointer;border-radius:99px; transition: width 300ms cubic-bezier(0.23,1,0.32,1), background 300ms; }
        .feat-btn { transition: transform 150ms cubic-bezier(0.23,1,0.32,1); }
        .feat-btn:active { transform:scale(0.91) !important; }
      `}</style>

      <div style={{ position:"absolute",top:0,left:0,right:0,height:2,background:"color-mix(in oklch, var(--sand) 8%, transparent)",zIndex:2 }}>
        <div style={{ height:"100%",background:"var(--coral)",transition:"width 380ms cubic-bezier(0.23,1,0.32,1)",width:`${((current+1)/total)*100}%` }} />
      </div>

      <div className="wrap" style={{ padding:"68px 28px 0" }}>
        <span className="mono" style={{ color:"var(--coral)",fontWeight:700,fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase" }}>
          {lang==="es" ? "La moto" : "Built different"}

      </div>

      <div className="wrap feat-split" style={{ flex:1, padding:"28px 28px 52px", display:"grid", gridTemplateColumns:"1fr 0.76fr", gap:"clamp(24px,7vw,84px)", alignItems:"center" }}>

          <div style={{ fontFamily:"var(--font-display)",fontWeight:800,fontSize:"clamp(64px,11vw,126px)",color:"color-mix(in oklch, var(--sand) 5%, transparent)",lineHeight:.85,letterSpacing:"-0.04em",marginBottom:"clamp(6px,1.5vw,16px)",userSelect:"none" }}>

          <div style={{ width:50,height:50,borderRadius:14,marginBottom:20,flexShrink:0,background:"color-mix(in oklch, var(--coral) 14%, transparent)",border:"1px solid color-mix(in oklch, var(--coral) 24%, transparent)",display:"grid",placeItems:"center" }}>

          <h2 style={{ fontFamily:"var(--font-display)",fontWeight:800,fontSize:"clamp(26px,3.8vw,46px)",color:"var(--sand)",lineHeight:1.05,letterSpacing:"-0.025em",margin:"0 0 18px" }}>

function FeatureChecks({ lang }) {
  const scrollRef = useRef(null);
  const [atStart,  setAtStart]  = useState(true);
  const [atEnd,    setAtEnd]    = useState(false);
  const [progress, setProgress] = useState(0);

  const checkEdges = () => {
    const el = scrollRef.current;
    if (!el) return;
    const max = el.scrollWidth - el.clientWidth;
    setAtStart(el.scrollLeft < 8);
    setAtEnd(el.scrollLeft + el.clientWidth >= el.scrollWidth - 8);
    setProgress(max > 0 ? el.scrollLeft / max : 0);
  };

  useEffect(() => {
    checkEdges();
    const el = scrollRef.current;
    if (el) el.addEventListener("scroll", checkEdges, { passive: true });
    return () => { if (el) el.removeEventListener("scroll", checkEdges); };
  }, []);

  const slide = (dir) => {
    const el = scrollRef.current;
    if (!el) return;
    const card = el.querySelector("[data-feat-card]");
    const step = card ? card.offsetWidth + 14 : 266;
    el.scrollBy({ left: dir * step, behavior: "smooth" });
  };

  return (
    <section style={{ background: "var(--sand-2)", padding: "52px 0 92px", position: "relative", overflow: "hidden" }}>
      <div style={{ position: "absolute", top: -120, right: -80, width: 420, height: 420, borderRadius: "50%", background: "radial-gradient(circle, color-mix(in oklch, var(--coral) 7%, transparent), transparent 70%)", pointerEvents: "none" }} />

<script type="text/babel">
function calc(booking) {
  const bike = BBM.FLEET.find((b) => b.id === booking.bikeId);
  const days = daysBetween(booking.from, booking.to) || 1;
  const qty = booking.qty || 1;
  const rental = bike ? bike.price * days * qty : 0;
  const extras = BBM.EXTRAS.filter((e) => booking.extras[e.id]).reduce((s, e) => s + e.price, 0);
  const total = rental + extras;
  return { bike, days, qty, rental, extras, total, deposit: Math.round(total * 0.2), rest: total - Math.round(total * 0.2) };
}

function Stepper({ step, t, onJump }) {
  const labels = [t.stepDates, t.stepReview];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 0, flexWrap: "wrap" }}>
      {labels.map((l, i) => {
        const done = i < step, active = i === step;
        return (
          <React.Fragment key={i}>
            <button onClick={() => i < step && onJump(i)} style={{ display: "flex", alignItems: "center", gap: 9, cursor: i < step ? "pointer" : "default" }}>
              <span style={{
                width: 28, height: 28, borderRadius: "50%", display: "grid", placeItems: "center",
                fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 13,
                background: done ? "var(--ocean)" : active ? "var(--coral)" : "var(--sand-3)",
                color: done || active ? "white" : "var(--ink-faint)", transition: "all .3s",
              }}>{done ? <Ic.check s={15} c="white" /> : i + 1}</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: active ? "var(--ink)" : done ? "var(--ink-soft)" : "var(--ink-faint)", whiteSpace: "nowrap" }} className="step-label">{l}</span>
            </button>
            {i < labels.length - 1 && <span style={{ flex: 1, minWidth: 16, height: 2, margin: "0 12px", background: i < step ? "var(--ocean)" : "var(--sand-3)", transition: "background .3s" }} />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function StepDates({ booking, set, t, lang }) {
  const days = daysBetween(booking.from, booking.to);
  const fld = { display: "flex", flexDirection: "column", gap: 8 };
  const lab = { fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: "var(--ink-faint)", display: "flex", alignItems: "center", gap: 7 };
  const inp = { padding: "14px 16px", borderRadius: "var(--r)", border: "1.5px solid var(--sand-3)", background: "var(--shell)", fontSize: 16, fontWeight: 700, color: "var(--ink)", fontFamily: "var(--font-body)", width: "100%" };
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 26 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }} className="two-col">
        <label style={fld}><span style={lab}><Ic.cal s={14} c="var(--ocean)" />{t.bkPickup}</span>
          <input type="date" style={inp} value={booking.from} min={todayISO(0)} onChange={(e) => set({ from: e.target.value, to: e.target.value >= booking.to ? "" : booking.to })} /></label>
        <label style={fld}><span style={lab}><Ic.cal s={14} c="var(--ocean)" />{t.bkReturn}</span>
          <input type="date" style={inp} value={booking.to} min={booking.from || todayISO(0)} onChange={(e) => set({ to: e.target.value })} /></label>
      </div>
      {days > 0 && (
        <div className="pill" style={{ alignSelf: "flex-start", background: "color-mix(in oklch, var(--ocean) 16%, transparent)", color: "var(--ocean-deep)" }}>
          <Ic.road s={15} c="var(--ocean-deep)" /> {days} {days === 1 ? t.day : t.days} {lang === "es" ? "de aventura" : "of adventure"}
        </div>
      )}
      <div style={fld}>
        <span style={lab}><Ic.pin s={14} c="var(--ocean)" />{t.bkPickLoc}</span>
        <div style={{ ...inp, color: "var(--ink-soft)", display: "flex", alignItems: "center", gap: 8 }}>
          <Ic.pin s={16} c="var(--ocean)" />
          {BBM.LOCATIONS[0][lang]}
        </div>
      </div>
      <div style={fld}>
        <span style={lab}><Ic.speedo s={14} c="var(--ocean)" />{t.bkQty}</span>
        <div style={{ display: "inline-flex", alignItems: "center", gap: 18, alignSelf: "flex-start", background: "var(--shell)", border: "1.5px solid var(--sand-3)", borderRadius: "var(--r-pill)", padding: "6px 8px" }}>
          {["-", "+"].map((sym) => (
            <button key={sym} onClick={() => set({ qty: Math.max(1, Math.min(6, (booking.qty || 1) + (sym === "+" ? 1 : -1))) })}
              style={{ width: 38, height: 38, borderRadius: "50%", background: "var(--sand-2)", color: "var(--ink)", fontSize: 22, fontWeight: 700, display: "grid", placeItems: "center", order: sym === "+" ? 2 : 0 }}>
              {sym}
            </button>
          ))}
          <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 24, minWidth: 28, textAlign: "center", order: 1 }}>{booking.qty || 1}</span>
        </div>
      </div>
    </div>
  );
}

function StepReview({ booking, t, lang, onEditDates }) {
  const c = calc(booking);
  const pick = BBM.LOCATIONS.find((l) => l.id === booking.pickLoc);
  const ret  = BBM.LOCATIONS.find((l) => l.id === (booking.sameLoc ? booking.pickLoc : booking.retLoc));
  const row = { display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, padding: "13px 0", borderBottom: "1px solid var(--sand-3)" };
  const k = { fontFamily: "var(--font-mono)", fontSize: 11, letterSpacing: "0.06em", textTransform: "uppercase", color: "var(--ink-faint)", paddingTop: 2 };
  const v = { fontWeight: 700, fontSize: 15, textAlign: "right" };
  return (
    <div>
      <div style={{ display: "flex", gap: 16, alignItems: "center", padding: 16, borderRadius: "var(--r-lg)", background: "var(--shell)", boxShadow: "var(--sh-sm)" }}>
        <div style={{ width: 100, borderRadius: "var(--r)", overflow: "hidden", flexShrink: 0 }}><BikeArt bike={c.bike} h={72} showLabel={false} /></div>
        <div style={{ minWidth: 0 }}>
          <div className="mono" style={{ fontSize: 10.5, color: "var(--ink-faint)" }}>{c.bike.brand}</div>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 20 }}>{c.bike.model}</div>
          <div style={{ fontSize: 13.5, color: "var(--ink-soft)", marginTop: 2 }}>{c.qty} × · {idrK(c.bike.price)}{t.perDay}</div>
        </div>
      </div>
      <div style={{ marginTop: 8 }}>
        <div style={row}>
          <span style={k}>{t.bkPickup}</span>
          <div style={{ display: "flex", alignItems: "flex-start", gap: 10 }}>
            <span style={v}>{fmtDate(booking.from, lang)} → {fmtDate(booking.to, lang)}<br /><span style={{ fontWeight: 600, color: "var(--ink-faint)", fontSize: 13 }}>{c.days} {c.days === 1 ? t.day : t.days}</span></span>
            {onEditDates && (
              <button onClick={onEditDates} style={{ fontFamily: "var(--font-mono)", fontSize: 10.5, color: "var(--ocean)", background: "none", border: "none", cursor: "pointer", padding: "2px 0", textDecoration: "underline", textTransform: "uppercase", letterSpacing: "0.06em", flexShrink: 0, marginTop: 1 }}>
                {lang === "es" ? "Editar" : "Edit"}
              </button>
            )}
          </div>
        </div>
        <div style={row}><span style={k}>{t.bkPickLoc}</span><span style={v}>{pick?.[lang]}</span></div>
        <div style={row}><span style={k}>{t.bkRetLoc}</span><span style={v}>{ret?.[lang]}</span></div>
      </div>
    </div>
  );
}

function SummaryCard({ booking, t, lang, compact }) {
  const c = calc(booking);
  const line = { display: "flex", justifyContent: "space-between", fontSize: 14.5, color: "var(--ink-soft)" };
  return (
    <div style={{ padding: compact ? 18 : 24 }}>
      <div className="mono" style={{ fontSize: 11, color: "var(--ink-faint)", letterSpacing: "0.1em" }}>{t.bkSummary}</div>
      {c.bike ? (
        <>
          <div style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 21, marginTop: 8 }}>{c.bike.brand} {c.bike.model}</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 11, marginTop: 18, paddingTop: 18, borderTop: "1px solid var(--sand-3)" }}>
            <div style={line}>
              <span>
                {idrK(c.bike.price)} × {c.days} {c.days === 1 ? t.day : t.days}
                {c.qty > 1 && <span style={{ marginLeft: 4, fontWeight: 700, color: "var(--coral)" }}>× {c.qty} {lang === "es" ? "motos" : "bikes"}</span>}
              </span>
              <span style={{ fontWeight: 700, color: "var(--ink)" }}>{idrK(c.rental)}</span>
            </div>
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 18, paddingTop: 18, borderTop: "2px solid var(--ink)" }}>
            <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 18 }}>{t.bkTotal}</span>
            <div style={{ textAlign: "right" }}>
              <div style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 30, color: "var(--coral)", lineHeight: 1 }}>{idrK(c.total)}</div>
              <div style={{ fontSize: 12, color: "var(--ink-faint)" }}>({c.days} {c.days === 1 ? t.day : t.days})</div>
            </div>
          </div>
        </>
      ) : (
        <p style={{ marginTop: 14, color: "var(--ink-faint)", fontSize: 14.5 }}>
          {lang === "es" ? "Elige las fechas para ver el precio." : "Pick dates to see your price."}
        </p>
      )}
    </div>
  );
}

Object.assign(window, { calc, Stepper, StepDates, StepReview, SummaryCard });
</script>

<script type="text/babel">
const CHECKOUT_URL = "checkout.php";

function BookingFlow({ booking, setBooking, t, lang, setLang, onExit, initialStep = 0 }) {
  const [step, setStep] = useState(initialStep);
  const set = (patch) => setBooking((b) => ({ ...b, ...patch }));
  const c = calc(booking);
  useEffect(() => { window.scrollTo({ top: 0 }); }, [step]);

  const valid = [
    daysBetween(booking.from, booking.to) > 0,
    true,
  ];
  const next = () => { if (step < 1) setStep(step + 1); };
  const StepComp = [StepDates, StepReview][step];
  const titles = [
    [t.stepDates, lang === "es" ? "¿Cuándo y dónde empieza la aventura?" : "When and where does the adventure start?"],
    [t.bkReviewTitle, lang === "es" ? "Revisa tu reserva y paga directamente con Stripe." : "Review your booking and pay directly with Stripe."],
  ][step];

  return (
    <div style={{ minHeight: "100vh", background: "var(--bg)", display: "flex", flexDirection: "column" }}>
      <header style={{ position: "sticky", top: 0, zIndex: 30, background: "color-mix(in oklch, var(--sand) 92%, transparent)", backdropFilter: "blur(12px)", borderBottom: "1px solid var(--sand-3)" }}>
        <div className="wrap" style={{ height: 70, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16 }}>
          <div onClick={onExit} style={{ cursor: "pointer" }}><Logo /></div>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <LangSwitch lang={lang} setLang={setLang} />
            <button onClick={onExit} style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--sand-2)", display: "grid", placeItems: "center", color: "var(--ink-soft)" }} aria-label="close">
              <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
            </button>
          </div>
        </div>
        <div className="wrap" style={{ paddingBottom: 16 }}>
          <Stepper step={step} t={t} onJump={setStep} />
        </div>
      </header>

      <div className="wrap booking-grid" style={{ flex: 1, padding: "40px 28px 120px", display: "grid", gridTemplateColumns: "minmax(0,1fr) 360px", gap: 40, alignItems: "start" }}>
        <div className="rise" key={step}>
          <span className="mono" style={{ color: "var(--coral)", fontWeight: 700 }}>{`0${step + 1} / 02`}</span>
          <h1 style={{ fontSize: "clamp(28px, 4vw, 42px)", marginTop: 10, marginBottom: 6 }}>{titles[0]}</h1>
          <p style={{ color: "var(--ink-soft)", fontSize: 16, marginBottom: 30 }}>{titles[1]}</p>
          <StepComp booking={booking} set={set} t={t} lang={lang} onEditDates={step === 1 ? () => setStep(0) : undefined} />

          <div className="bk-actions" style={{ display: "flex", gap: 12, marginTop: 36, alignItems: "center" }}>
            {step > 0 && <button className="btn btn-ghost" onClick={() => setStep(step - 1)}><Ic.arrowL s={18} /> {t.bkBack}</button>}
            {step < 1
              ? <button className="btn btn-primary" disabled={!valid[step]} style={{ opacity: valid[step] ? 1 : 0.45, cursor: valid[step] ? "pointer" : "not-allowed", marginLeft: "auto" }} onClick={next}>{t.bkContinue} <Ic.arrow s={18} c="white" /></button>
              : <button className="btn btn-primary btn-lg" style={{ marginLeft: "auto" }} onClick={() => {
                // Google Ads — conversión en IDR al hacer clic en Pagar
                if (typeof gtag !== "undefined") {
                  gtag("event", "conversion", {
                    send_to: "AW-18215532149/knGLCLPOr7kcEPXs6-1D",
                    value: c.total,
                    currency: "IDR",
                    transaction_id: booking.from + "-" + booking.to + "-" + c.qty + "-" + Date.now(),
                  });
                }
                const p = new URLSearchParams({ days: c.days, qty: c.qty, from: booking.from, to: booking.to });
                try {
                  const utm = JSON.parse(sessionStorage.getItem("sr_utm") || "{}");
                  Object.entries(utm).forEach(([k, v]) => p.set(k, v));
                } catch(e) {}
                window.location.href = CHECKOUT_URL + "?" + p.toString();
              }}><Ic.lock s={18} c="white" /> {t.bkPay} · {idrK(c.total)}</button>}
          </div>
          {step === 1 && <p style={{ marginTop: 14, fontSize: 12.5, color: "var(--ink-faint)", display: "flex", alignItems: "center", gap: 7, justifyContent: "flex-end" }}><Ic.shield s={14} c="var(--ocean)" /> {t.bkSecure}</p>}
        </div>

        <aside className="booking-summary" style={{ position: "sticky", top: 150 }}>
          <div className="card" style={{ overflow: "hidden" }}>
            <SummaryCard booking={booking} t={t} lang={lang} />
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 9, marginTop: 16, padding: "0 4px", color: "var(--ink-faint)", fontSize: 12.5 }}>
            <Ic.shield s={15} c="var(--ocean)" /> {lang === "es" ? "Cancelación gratis hasta 24h antes" : "Free cancellation up to 24h before"}
          </div>
        </aside>
      </div>
    </div>
  );
}

Object.assign(window, { BookingFlow });
</script>

<!-- ── ScrollTop ─────────────────────────────────────────────────── -->
<script type="text/babel">
function ScrollTop() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const fn = () => setShow(window.scrollY > 400);
    window.addEventListener("scroll", fn, { passive: true });
    return () => window.removeEventListener("scroll", fn);
  }, []);
  return (
    <button className="scroll-top-btn"
      onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
      aria-label="Back to top"
      style={{
        position: "fixed", bottom: 88, right: 24, zIndex: 90,
        width: 44, height: 44, borderRadius: "50%",
        background: "var(--night)", border: "none", cursor: "pointer",
        display: "grid", placeItems: "center",
        boxShadow: "0 4px 16px oklch(0.25 0.04 210 / 0.28)",
        opacity: show ? 1 : 0, pointerEvents: show ? "all" : "none",
        transform: show ? "translateY(0)" : "translateY(10px)",
        transition: "opacity .3s, transform .3s",
      }}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="var(--sand)" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>
  );
}
Object.assign(window, { ScrollTop });
</script>

<!-- ── App ───────────────────────────────────────────────────────── -->
<script type="text/babel">
const { useState, useEffect } = React;

function App() {
  const [lang, setLang] = useState("en");
  const [route, setRoute] = useState("home");
  const [entryStep, setEntryStep] = useState(0);
  const [booking, setBooking] = useState({
    from: todayISO(2), to: todayISO(7),
    pickLoc: BBM.LOCATIONS[0].id, retLoc: BBM.LOCATIONS[0].id, sameLoc: true,
    bikeId: BBM.FLEET[0].id, qty: 1, extras: {},
  });
  const tr = BBM.I18N[lang];

  // Capturar UTM params del anuncio y guardar en sessionStorage
  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    const keys = ["utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "fbclid"];
    const utm = {};
    keys.forEach(k => { const v = p.get(k); if (v) utm[k] = v; });
    if (Object.keys(utm).length > 0) {
      try { sessionStorage.setItem("sr_utm", JSON.stringify(utm)); } catch(e) {}
    }
  }, []);

  useEffect(() => { window.scrollTo({ top: 0 }); }, [route]);

  const goBooking = (step) => { setEntryStep(step); setRoute("booking"); };
  const onSearch  = ({ from, to, loc }) => { setBooking((b) => ({ ...b, from, to, pickLoc: loc, retLoc: loc })); goBooking(0); };
  const onReserve = (bike) => { if (bike.comingSoon) return; setBooking((b) => ({ ...b, bikeId: bike.id })); goBooking(0); };
  const onBook    = () => goBooking(0);
  const reset     = () => setBooking({ from: todayISO(2), to: todayISO(7), pickLoc: BBM.LOCATIONS[0].id, retLoc: BBM.LOCATIONS[0].id, sameLoc: true, bikeId: BBM.FLEET[0].id, qty: 1, extras: {} });

  return (
    <>
      {route === "home" && (
        <>
          <NavBar t={tr} lang={lang} setLang={setLang} onBook={onBook} dark onHome={() => window.scrollTo({ top: 0, behavior: "smooth" })} />
          <Home t={tr} lang={lang} onSearch={onSearch} onReserve={onReserve} onBook={onBook} layout="split" />
          <Footer t={tr} lang={lang} />
        </>
      )}
      {route === "booking" && (
        <BookingFlow key={entryStep + booking.bikeId} booking={booking} setBooking={setBooking} t={tr} lang={lang} setLang={setLang}
          initialStep={entryStep} onExit={() => setRoute("home")} />
      )}

      <WaFloat lang={lang} />
      <ScrollTop />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

(function () {
  const settle = () => {
    if (document.visibilityState !== "visible") {
      document.getAnimations().forEach((a) => { try { a.finish(); } catch (_) {} });
    }
  };
  document.addEventListener("visibilitychange", settle);
  setInterval(settle, 400);
})();
</script>

</body>
</html>
